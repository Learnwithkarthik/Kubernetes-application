apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal-viewer
  namespace: student-portal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: student-portal
rules:
- apiGroups: [""]
  resources: [pods, pods/log, services]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portal-viewer-binding
  namespace: student-portal
subjects:
- kind: ServiceAccount
  name: portal-viewer
  namespace: student-portal
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: pod-reader}
